# The counterpart to taints.yaml: this Deployment has NO tolerations.
#
# Taint a node, apply both files, and you get the whole lesson in one view:
#   taints.yaml       tolerates the taint -> Pods schedule on that node
#   deployment.yaml   does not tolerate   -> Pods stay Pending
#
# A Pending Pod here is the expected result, not a bug.
#
# Prereq: the `development` namespace is created by
# 01-foundations/01-namespace/namespace.yaml, so apply module 01 first.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: untolerated-app
  namespace: development
spec:
  replicas: 2
  selector:
    matchLabels:
      app: untolerated-app
  template:
    metadata:
      labels:
        app: untolerated-app
    spec:
      containers:
      - name: untolerated-app-container
        image: nginx:1.27.1
        ports:
        - containerPort: 80