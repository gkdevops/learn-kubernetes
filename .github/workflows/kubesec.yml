name: Kubesec

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  scan:
    name: Kubesec scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run kubesec scanner
        uses: controlplaneio/kubesec-action@43d0ddff5ffee89a6bb9f29b64cd865411137b14
        with:
          # Update this path if you want to scan a different manifest.
          input: 03-workload-controllers/02-deployment/deployment.yaml
          format: json
          output: kubesec-results.json
          exit-code: "0"
