apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-quota
spec:
  hard:
    # Two equivalent syntaxes for counting objects:
    #   1. built-in resource names (pods, services, secrets...)
    #   2. count/<group-version of resource> for anything else
    # Both limit how many objects the namespace may contain.
    cpu: "1"                       # total CPU requested by all containers
    memory: 700Mi                  # total memory requested
    pods: "4"
    services: "2"
    secrets: "3"
    count/configmaps: "2"
    count/deployments.apps: "4"
    count/jobs.batch: "5"
    count/cronjobs.batch: "3"
