apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-with-aws-secrets
  labels:
    app: aws-secrets-demo
spec:
  selector:
    matchLabels:
      app: aws-secrets-demo
  template:
    metadata:
      labels:
        app: aws-secrets-demo
    spec:
      containers:
      - name: app
        image: nginx:1.27.1
        ports:
        - containerPort: 80
        # ---- Option 1: volume mount (files appear under /mnt/secrets) ----
        volumeMounts:
          - name: secrets-volume
            mountPath: /mnt/secrets
            readOnly: true
        # ---- Option 2: env vars from the synced K8s Secret ----
        env:
          - name: DB_USERNAME
            valueFrom:
              secretKeyRef:
                name: demo-creds-synced
                key: username
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: demo-creds-synced
                key: password
      volumes:
        - name: secrets-volume
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: aws-secrets-demo
