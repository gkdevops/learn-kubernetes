apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: aws-secrets-demo
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "learn-k8s/demo-creds"
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectAlias: username
          - path: password
            objectAlias: password
  # Sync the CSI volume into a regular K8s Secret so it can also be used
  # via env-var secretKeyRef (not just volume mounts).
  secretObjects:
    - secretName: demo-creds-synced
      type: Opaque
      data:
        - objectName: username
          key: username
        - objectName: password
          key: password
