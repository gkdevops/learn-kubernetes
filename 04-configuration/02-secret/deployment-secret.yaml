# Consuming a Secret as environment variables via secretKeyRef.
#
# A Secret is only base64-encoded, NOT encrypted - anyone with read access to
# the namespace can decode it with:
#   kubectl get secret sales-creds -o jsonpath='{.data.username}' | base64 -d
# That is exactly why 03-external-secret/ exists: it keeps real credentials in
# AWS Secrets Manager and syncs them in, instead of committing them to git.
#
# Own name and labels on purpose: 01-configmap/deployment-file.yaml mounts a
# ConfigMap as a file with the same nginx image, and the two must coexist.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment-secret
  labels:
    app: nginx-secret
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-secret
  template:
    metadata:
      labels:
        app: nginx-secret
    spec:
      containers:
      - name: nginx-cont
        image: nginx:1.27.1
        ports:
        - containerPort: 80
        env:
          - name: username
            valueFrom:
              secretKeyRef:
                name: sales-creds
                key: username
          - name: password
            valueFrom:
              secretKeyRef:
                name: sales-creds
                key: password