---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sales-dev
data:
  JAVA_HOME: /opt/java1.8.212/bin/java
  API_ENDPOINT: http://abcdbstg01.corp.com:5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales-deployment
  labels:
    app: sales
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sales
  template:
    metadata:
      labels:
        app: sales
    spec:
      containers:
      - name: sales-app
        image: nginx:1.27.1
        ports:
        - containerPort: 80
        env:
        - name: JAVA_HOME
          valueFrom:
            configMapKeyRef:
              name: sales-dev
              key: JAVA_HOME
        - name: API_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: sales-dev
              key: API_ENDPOINT
