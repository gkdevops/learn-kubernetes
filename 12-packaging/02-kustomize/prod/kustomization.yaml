apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# `bases` and `patchesStrategicMerge` are removed in Kustomize v5 (kubectl >= 1.27).
# Use `resources` to inherit and `patches` for strategic merge files.
resources:
  - ../base

labels:
  - pairs:
      env: prod

patches:
  - path: deployment.yaml
  - path: configmap.yaml
