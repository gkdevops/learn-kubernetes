apiVersion: v1
kind: Service
metadata:
  name: sampleapp
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http # the named container port
      nodePort: {{ .Values.service.nodeport }}
      protocol: TCP
      name: http
  selector:
    app: sampleapp    
